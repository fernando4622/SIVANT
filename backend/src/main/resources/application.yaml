# Configuración base: valores seguros para un entorno real. El perfil dev los relaja.
spring:
  application:
    name: sivant
  config:
    # .env de la raíz (no versionado). Las variables del sistema tienen prioridad.
    import:
      - "optional:file:../.env[.properties]"
      - "optional:file:./.env[.properties]"
  datasource:
    url: jdbc:postgresql://${SIVANT_DB_HOST:localhost}:${SIVANT_DB_PORT:5433}/${SIVANT_DB_NAME:sivant}
    username: ${SIVANT_DB_USER:sivant_app}
    password: ${SIVANT_DB_PASSWORD:}
  flyway:
    default-schema: sivant
    schemas: sivant
    create-schemas: true
    locations: classpath:db/migration
    clean-disabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: sivant
        jdbc.time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      # La imagen de un producto pesa hasta 2 MB; el servicio vuelve a validarlo.
      max-file-size: 2MB
      max-request-size: 3MB

server:
  port: ${SIVANT_HTTP_PORT:8080}
  servlet:
    session:
      # Debe ser igual o mayor que sivant.sesion.inactividad, que es la regla efectiva.
      timeout: 45m
      tracking-modes: cookie
      cookie:
        name: SIVANT_SESION
        path: /
        http-only: true
        secure: true
        same-site: lax

sivant:
  imagenes:
    # Carpeta local de las imágenes de productos. En el despliegue se apunta a un volumen persistente.
    directorio: ${SIVANT_IMAGENES_DIR:almacen}
  sesion:
    inactividad: 45m
  administrador-inicial:
    nombre: ${SIVANT_ADMIN_NOMBRE:}
    correo: ${SIVANT_ADMIN_CORREO:}
    contrasena: ${SIVANT_ADMIN_CONTRASENA:}
