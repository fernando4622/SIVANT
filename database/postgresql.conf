# Configuración local de PostgreSQL 18 para SIVANT.
listen_addresses = '*'
max_connections = 50
shared_buffers = 128MB
# Los instantes se guardan en UTC. La zona del negocio se aplica en la aplicación.
timezone = 'UTC'
log_timezone = 'UTC'
password_encryption = 'scram-sha-256'
log_min_duration_statement = 500ms
